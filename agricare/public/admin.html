<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgriCare - Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="logo" href="/">🌱 Agri<span>Care</span></a>
      <nav class="nav"><a href="/">Diseases</a><a href="/admin.html">Admin</a></nav>
    </div>
  </header>

  <main class="container">
    <!-- Login -->
    <section id="login" class="panel" style="max-width:420px;margin:30px auto">
      <h2>Admin login</h2>
      <div id="login-msg"></div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>
      <button id="login-btn" class="btn">Log in</button>
    </section>

    <!-- Admin tools -->
    <div id="tools" hidden>
      <section class="panel">
        <h2 id="form-title">Add a disease</h2>
        <div id="form-msg"></div>
        <form id="disease-form">
          <div class="row2">
            <div class="field"><label>Disease / problem name *</label><input name="name" required placeholder="e.g. Powdery Mildew"></div>
            <div class="field"><label>Plant *</label><input name="plant" required placeholder="e.g. Tomato"></div>
          </div>
          <div class="row2">
            <div class="field">
              <label>Main cause type *</label>
              <select name="category" required></select>
            </div>
            <div class="field">
              <label>Photo (JPG, PNG, WEBP, max 5 MB)</label>
              <input name="image" type="file" accept="image/jpeg,image/png,image/webp">
              <small>When editing, leave empty to keep the current photo.</small>
            </div>
          </div>
          <div class="field"><label>What it looks like (symptoms) *</label><textarea name="symptoms" rows="3" required></textarea></div>
          <div class="field"><label>Main cause (pest, weather, soil quality, etc.) *</label><textarea name="cause" rows="3" required></textarea></div>
          <div class="field"><label>Prevention</label><textarea name="prevention" rows="4"></textarea><small>One tip per line.</small></div>
          <div class="field"><label>Treatment</label><textarea name="treatment" rows="4"></textarea><small>One step per line.</small></div>
          <button class="btn" id="submit-btn" type="submit">Save disease</button>
          <button class="btn secondary" id="cancel-edit" type="button" hidden>Cancel edit</button>
        </form>
      </section>

      <section class="panel">
        <h2>Existing entries</h2>
        <div id="admin-list" class="admin-list"></div>
      </section>
    </div>
  </main>
  <script type="module" src="js/adminMain.js"></script>
</body>
</html>
